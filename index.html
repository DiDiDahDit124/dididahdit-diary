<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no, date=no, email=no, address=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="嘀嘀嗒嘀的日记">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" id="themeColor" content="#f4eef8">
  <meta name="description" content="嘀嘀嗒嘀的日记，写给 DiDiDahDit 的本地手帐。">
  <title>嘀嘀嗒嘀的日记</title>
  <!--
    想改这本日记，先看这几处：
    1. 脚本里的 PROFILE        名字、生日、摩斯符号
    2. 下面的 :root            浅色 / 深色配色
    3. SOLAR_HOLIDAYS          公历节日
    4. LUNAR_HOLIDAYS          农历节日（只标常月，不标闰月）
    5. QUADS                   四个象限的标题和提示
    6. EXP_CATS / IN_CATS      支出、收入分类
    数据在 localStorage，键名 hydrangea-diary-didi-v1。
    用手机浏览器直接打开本文件即可。请固定从同一个入口打开，
    清站点数据前先在右上角导出 JSON。
  -->
  <script>
    (function () {
      try {
        var raw = localStorage.getItem("hydrangea-diary-didi-v1");
        var saved = raw ? JSON.parse(raw).theme : null;
        var theme = saved === "dark" || saved === "light"
          ? saved
          : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
        var meta = document.getElementById("themeColor");
        if (meta) meta.setAttribute("content", theme === "dark" ? "#13101a" : "#f4eef8");
      } catch (e) {}
    })();
  </script>
  <style>
    /* ===== 配色：浅色为默认，深色写在 html[data-theme="dark"] ===== */
    :root {
      --bg: #f4eef8;
      --paper: rgba(255, 252, 254, 0.92);
      --paper-solid: #fffcfe;
      --ink: #2b2336;
      --muted: #746883;
      --line: rgba(86, 52, 122, 0.14);
      --violet: #7348a8;
      --deep: #432868;
      --lavender: #d9c8ee;
      --mist: #f3ebf8;
      --neon: #a678ff;
      --gold: #c9962e;
      --gold-2: #f3dd9a;
      --gold-ink: #7a5a12;
      --rose: #b25b86;
      --good: #2f8a62;
      --warn: #a33b55;
      --fill: #432868;
      --on-fill: #ffffff;
      --shadow: 0 14px 34px rgba(74, 42, 112, 0.08);
      --blob-a: #e7d4f6;
      --blob-b: #f8e4f1;
      --blob-c: #f3e7c2;
      --weekend: #a45d86;
      --chip: #f4eaf8;
      --serif: "Iowan Old Style", Palatino, "Palatino Linotype", "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", serif;
      --sans: "PingFang SC", "Hiragino Sans GB", "Segoe UI", "Noto Sans SC", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
      --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
      --radius: 22px;
      color-scheme: light;
    }
    html[data-theme="dark"] {
      --bg: #13101a;
      --paper: rgba(34, 27, 48, 0.94);
      --paper-solid: #241b32;
      --ink: #f6f1fb;
      --muted: #cfc3e2;
      --line: rgba(226, 210, 255, 0.16);
      --violet: #d2b6ff;
      --deep: #f3e9ff;
      --lavender: #6a5488;
      --mist: #2c2440;
      --neon: #d7c0ff;
      --gold: #f0d48a;
      --gold-2: #5a4a28;
      --gold-ink: #f8e7b8;
      --rose: #f0a0c4;
      --good: #8ed7b4;
      --warn: #ffb4c6;
      --fill: #d2b6ff;
      --on-fill: #221430;
      --shadow: 0 16px 36px rgba(0, 0, 0, 0.38);
      --blob-a: #3a2758;
      --blob-b: #3a2438;
      --blob-c: #3a3420;
      --weekend: #f0b4d0;
      --chip: #322844;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: var(--sans);
      color: var(--ink);
      line-height: 1.5;
      background:
        radial-gradient(900px 520px at -10% -10%, var(--blob-a), transparent 60%),
        radial-gradient(720px 480px at 110% 0%, var(--blob-b), transparent 55%),
        radial-gradient(640px 420px at 80% 110%, var(--blob-c), transparent 50%),
        var(--bg);
      touch-action: manipulation;
    }
    button, input, textarea { font: inherit; color: inherit; }
    button { background: none; border: 0; padding: 0; cursor: pointer; }
    button:active { transform: scale(0.98); }
    button.mask, button.mask:active { transform: none; }
    textarea, input { border: 0; background: transparent; }
    textarea:focus, input:focus { outline: none; }
    :focus-visible { outline: 2px solid var(--neon); outline-offset: 2px; }
    ::placeholder { color: color-mix(in srgb, var(--muted) 78%, transparent); }
    ::selection { background: rgba(166, 120, 255, 0.28); }
    h1, h2, h3, p, ul { margin: 0; }
    ul { padding: 0; list-style: none; }

    .morse-texture {
      position: fixed; inset: 0; width: 100%; height: 100%;
      z-index: 0; pointer-events: none; opacity: 0.22;
    }
    html[data-theme="dark"] .morse-texture { opacity: 0.14; }
    .md { fill: var(--violet); }

    .bg-flower {
      position: fixed; width: min(54vw, 280px); height: auto;
      z-index: 0; pointer-events: none;
      animation: floaty 12s ease-in-out infinite;
    }
    .bg-flower.tr { top: -36px; right: -54px; }
    .bg-flower.bl { bottom: 36px; left: -78px; opacity: 0.55; animation-delay: -5s; }
    html[data-theme="dark"] .bg-flower { opacity: 0.38; }
    html[data-theme="dark"] .bg-flower.bl { opacity: 0.26; }
    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .app {
      position: relative;
      z-index: 1;
      width: min(520px, 100%);
      margin: 0 auto;
      min-height: 100dvh;
      padding: 0 16px calc(108px + env(safe-area-inset-bottom));
    }

    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      position: sticky; top: 0; z-index: 6;
      margin: 0 -16px;
      padding: calc(8px + env(safe-area-inset-top)) 16px 10px;
      background: color-mix(in srgb, var(--bg) 82%, transparent);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .brand-flower { width: 44px; height: 44px; flex: none; }
    .brand h1 {
      font-family: var(--serif); font-size: 18px; font-weight: 600;
      letter-spacing: 0.16em;
    }
    .who { font-size: 11px; letter-spacing: 0.04em; color: var(--muted); }
    .save-status { margin-left: 0.4em; color: var(--good); opacity: 0; transition: opacity 0.3s ease; }
    .save-status.show { opacity: 1; }
    .save-status.warn { color: var(--warn); }
    .top-actions { display: flex; gap: 8px; }
    .icon-btn {
      width: 40px; height: 40px; border-radius: 14px;
      display: grid; place-items: center;
      background: var(--paper-solid); color: var(--deep);
      border: 1px solid var(--line);
    }
    .icon-btn svg { width: 20px; height: 20px; display: block; }
    html[data-theme="light"] .ico-sun, html[data-theme="dark"] .ico-moon { display: none; }

    .morse { display: inline-flex; align-items: center; gap: 4px; color: var(--violet); }
    .morse .dot, .morse .dash { display: block; background: currentColor; }
    .morse .dot { width: 5px; height: 5px; border-radius: 50%; }
    .morse .dash { width: 16px; height: 4px; border-radius: 99px; }
    .morse.mini { gap: 3px; }
    .morse.mini .dot { width: 4px; height: 4px; }
    .morse.mini .dash { width: 12px; height: 3px; }
    .morse i { animation: breathe 3.8s ease-in-out infinite; }
    .morse i:nth-child(1) { animation-delay: 0s; }
    .morse i:nth-child(2) { animation-delay: 0.12s; }
    .morse i:nth-child(3) { animation-delay: 0.28s; }
    .morse i:nth-child(4) { animation-delay: 0.62s; }
    .morse.once i { opacity: 0.2; animation: dit 1.1s ease forwards; }
    .morse.once i:nth-child(1) { animation-delay: 0.1s; }
    .morse.once i:nth-child(2) { animation-delay: 0.28s; }
    .morse.once i:nth-child(3) { animation-delay: 0.5s; }
    .morse.once i:nth-child(4) { animation-delay: 0.95s; }
    .morse.is-hot { color: var(--gold); }
    .morse.is-hot i { animation: hot 0.7s ease; }
    @keyframes breathe { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
    @keyframes dit { 0% { opacity: 0.15; } 35%, 100% { opacity: 1; } }
    @keyframes hot {
      0% { opacity: 0.4; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-2px); }
      100% { opacity: 0.8; transform: none; }
    }

    .view { display: none; }
    .view.is-on { display: flex; flex-direction: column; gap: 12px; animation: fade 0.28s ease; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .date-card {
      position: relative; overflow: hidden;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 14px 12px 12px;
      box-shadow: var(--shadow);
    }
    .date-card.is-bday { animation: bdayglow 2.8s ease-in-out infinite; }
    @keyframes bdayglow {
      0%, 100% { box-shadow: inset 0 0 0 1.5px #e3c36a, 0 12px 30px rgba(201, 150, 46, 0.16); }
      50% { box-shadow: inset 0 0 0 1.5px #f6e7b0, 0 16px 36px rgba(201, 150, 46, 0.32); }
    }
    .date-card::before {
      content: ""; position: absolute; inset: 0; pointer-events: none;
    }
    .date-card[data-mood="willow"]::before { background: linear-gradient(180deg, rgba(126, 163, 106, 0.18), transparent 48%); }
    .date-card[data-mood="snow"]::before { background: linear-gradient(180deg, rgba(255, 255, 255, 0.35), transparent 42%); }
    .date-card[data-mood="spark"]::before { background: radial-gradient(circle at 80% 0%, rgba(243, 221, 154, 0.45), transparent 42%); }
    .date-card[data-mood="lantern"]::before { background: radial-gradient(circle at 15% 0%, rgba(255, 176, 92, 0.2), transparent 36%); }
    #dayStage { position: relative; z-index: 1; }
    .from-right { animation: slideInRight 0.38s cubic-bezier(.2, .8, .2, 1); }
    .from-left { animation: slideInLeft 0.38s cubic-bezier(.2, .8, .2, 1); }
    .from-fade { animation: fade 0.32s ease; }
    @keyframes slideInRight { from { opacity: 0.2; transform: translateX(26px); } to { opacity: 1; transform: none; } }
    @keyframes slideInLeft { from { opacity: 0.2; transform: translateX(-26px); } to { opacity: 1; transform: none; } }

    .date-head { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 4px; }
    .date-center { text-align: center; }
    .date-year { font-size: 12px; letter-spacing: 0.28em; color: var(--muted); }
    .date-num-wrap { position: relative; display: inline-block; }
    .date-card.is-bday .date-num-wrap { margin-top: 16px; }
    .date-num {
      font-family: var(--serif); font-size: 64px; line-height: 0.85;
      color: var(--deep); font-weight: 560;
    }
    .date-card.is-bday .date-num {
      background: linear-gradient(180deg, #fbe8a8, #d7a441 70%, #a97820);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .crown { width: 28px; height: 18px; position: absolute; left: 50%; top: -14px; transform: translateX(-50%); z-index: 2; }
    .date-sub { margin-top: 4px; font-size: 14px; letter-spacing: 0.08em; }
    .lunar-line { margin-top: 2px; font-size: 12px; color: var(--muted); }
    .arrow {
      width: 44px; height: 44px; border-radius: 50%;
      display: grid; place-items: center;
      background: var(--paper-solid); color: var(--deep);
      border: 1px solid var(--line);
    }
    .arrow svg { width: 18px; height: 18px; display: block; }
    .arrow svg.flip { transform: scaleX(-1); }
    .arrow:disabled { opacity: 0.28; }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 10px; }
    .chip {
      display: inline-flex; align-items: center;
      padding: 4px 10px; border-radius: 999px;
      background: var(--chip); color: var(--deep);
      font-size: 12px; letter-spacing: 0.04em;
    }
    .chip[data-kind="bday"] { background: var(--gold-2); color: var(--gold-ink); }
    .chip[data-kind="term"] { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); }
    .chip.more { background: transparent; color: var(--muted); }
    .holiday-note { text-align: center; font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.55; }
    .bday-banner {
      margin: 8px auto 0; max-width: 100%;
      padding: 7px 10px; border-radius: 12px;
      background: linear-gradient(90deg, transparent, var(--gold-2), transparent);
      color: var(--gold-ink); font-size: 13px; letter-spacing: 0.06em;
    }
    .today-pill {
      display: inline-flex; align-items: center; height: 32px; margin-top: 8px; padding: 0 12px;
      border-radius: 999px; background: var(--mist); color: var(--deep);
      font-size: 12px; letter-spacing: 0.08em;
    }
    .bday-stars { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
    .bday-stars i {
      position: absolute; width: 4px; height: 4px; border-radius: 50%;
      background: #fff; box-shadow: 0 0 8px #f0d48a;
      animation: twinkle 1.8s ease-in-out infinite;
    }
    .bday-stars i:nth-child(1) { top: 18%; left: 18%; }
    .bday-stars i:nth-child(2) { top: 28%; right: 16%; animation-delay: 0.4s; }
    .bday-stars i:nth-child(3) { bottom: 22%; left: 14%; animation-delay: 0.8s; }
    .bday-stars i:nth-child(4) { top: 10%; left: 46%; animation-delay: 0.2s; }
    @keyframes twinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }

    .weather-block { margin-top: 12px; }
    .weather-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .weather-top > span { font-size: 12px; letter-spacing: 0.16em; color: var(--muted); white-space: nowrap; }
    .weather-note {
      display: flex; align-items: center; flex: 1; min-width: 0;
      margin-left: 12px; height: 36px; padding: 0 10px;
      border-radius: 12px; background: var(--mist);
    }
    .weather-note input { flex: 1; min-width: 0; width: 100%; font-size: 16px; }
    .weather-row { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
    .weather-row::-webkit-scrollbar { display: none; }
    .wchip {
      flex: 1; min-width: 42px; height: 48px; border-radius: 14px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
      background: var(--paper-solid); color: var(--muted); border: 1px solid var(--line);
    }
    .wchip svg { width: 18px; height: 18px; display: block; }
    .wchip span { font-size: 11px; letter-spacing: 0.04em; }
    .wchip.is-on { background: var(--fill); color: var(--on-fill); border-color: transparent; }

    .morse-div { display: flex; align-items: center; gap: 10px; color: var(--lavender); }
    .morse-div .line { height: 1px; flex: 1; background: linear-gradient(90deg, transparent, var(--line), transparent); }

    .empty-hint { text-align: center; color: var(--muted); font-size: 13px; }

    .quad-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .quad {
      min-width: 0; display: flex; flex-direction: column; gap: 6px;
      padding: 8px 8px 6px; border-radius: 18px;
      background: var(--paper); border: 1px solid var(--line); border-top: 3px solid var(--accent);
      box-shadow: var(--shadow);
    }
    .quad[data-key="ate"] { --accent: #c989b4; }
    .quad[data-key="gratitude"] { --accent: #c9962e; }
    .quad[data-key="did"] { --accent: #7348a8; }
    .quad[data-key="mutter"] { --accent: #7f8ec4; }
    html[data-theme="dark"] .quad[data-key="ate"] { --accent: #f0b4d4; }
    html[data-theme="dark"] .quad[data-key="gratitude"] { --accent: #f0d48a; }
    html[data-theme="dark"] .quad[data-key="did"] { --accent: #d2b6ff; }
    html[data-theme="dark"] .quad[data-key="mutter"] { --accent: #c5d0f4; }
    .quad:focus-within {
      border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
      box-shadow: 0 10px 28px rgba(110, 69, 160, 0.16);
    }
    .quad header { display: flex; align-items: center; gap: 4px; }
    .q-ico {
      width: 22px; height: 22px; border-radius: 8px; flex: none;
      display: grid; place-items: center; color: var(--accent);
      background: color-mix(in srgb, var(--accent) 18%, var(--paper-solid));
    }
    .q-ico svg, .expand svg { width: 15px; height: 15px; display: block; }
    .quad h2 { flex: 1; min-width: 0; font-size: 13px; font-weight: 650; white-space: nowrap; }
    .expand {
      width: 28px; height: 28px; border-radius: 9px; color: var(--muted);
      display: grid; place-items: center; flex: none;
    }
    .quad textarea {
      width: 100%; min-height: 108px; resize: vertical;
      font-size: 16px; line-height: 1.55; padding: 0;
    }

    .receipt {
      background: var(--paper); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow);
    }
    .receipt-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; }
    .block-title { font-size: 12px; letter-spacing: 0.18em; color: var(--muted); font-weight: 600; }
    .month-spend { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .money-num { font-family: var(--serif); font-size: 28px; font-weight: 600; }
    .cats { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 10px 0; }
    .cats::-webkit-scrollbar { display: none; }
    .cat {
      flex: none; height: 32px; padding: 0 10px; border-radius: 999px;
      background: var(--mist); color: var(--muted); font-size: 12px;
    }
    .cat.is-on { background: var(--fill); color: var(--on-fill); }
    .entry-row { display: grid; grid-template-columns: 108px 1fr auto; gap: 8px; }
    .money, .note-input {
      height: 44px; border-radius: 12px; background: var(--mist); font-size: 16px;
    }
    .money { display: flex; align-items: center; gap: 2px; padding: 0 8px; }
    .money input { width: 100%; min-width: 0; font-size: 16px; }
    .note-input { width: 100%; min-width: 0; padding: 0 10px; }
    .primary {
      height: 44px; padding: 0 14px; border-radius: 12px;
      background: var(--fill); color: var(--on-fill); letter-spacing: 0.12em;
    }
    .form-error { color: var(--warn); font-size: 12px; margin-top: 6px; }
    .pay {
      display: grid; grid-template-columns: auto 1fr auto auto;
      gap: 8px; align-items: center; padding: 8px 0;
      border-bottom: 1px solid var(--line);
    }
    .catname {
      font-size: 11px; letter-spacing: 0.06em; background: var(--mist);
      color: var(--deep); border-radius: 999px; padding: 3px 8px;
    }
    .note { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .amt { font-family: var(--serif); font-size: 16px; }
    .del { width: 32px; height: 32px; border-radius: 10px; color: var(--muted); font-size: 18px; }
    .quiet { color: var(--muted); font-size: 13px; padding: 8px 0; }

    .month-bar { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; }
    .month-title { text-align: center; }
    .month-title h2 { font-family: var(--serif); font-size: 22px; font-weight: 600; letter-spacing: 0.06em; }
    .text-btn { color: var(--violet); font-size: 12px; letter-spacing: 0.08em; padding: 4px; }
    .lead { color: var(--muted); font-size: 13px; text-align: center; }
    .weekhead, .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .weekhead span { text-align: center; font-size: 12px; color: var(--muted); }
    .weekhead span:nth-child(6), .weekhead span:nth-child(7) { color: var(--weekend); }
    .cell {
      min-height: 68px; border-radius: 14px; position: relative;
      background: color-mix(in srgb, var(--paper) 90%, transparent);
      border: 1px solid transparent;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 1px;
      padding: 8px 1px 4px;
    }
    .cell.empty { background: transparent; min-height: 68px; }
    .cell .n { font-family: var(--serif); font-size: 16px; line-height: 1; }
    .cell[data-week="0"] .n, .cell[data-week="6"] .n { color: var(--weekend); }
    .cell .tag {
      min-height: 24px; max-width: 100%;
      font-size: 10px; line-height: 1.2; letter-spacing: 0; text-align: center; color: var(--muted);
      display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
      overflow: hidden; overflow-wrap: anywhere;
    }
    .cell .dots { display: flex; gap: 3px; height: 5px; }
    .cell .dots i { width: 4px; height: 4px; border-radius: 50%; display: block; }

    }
    .mini-crown { position: absolute; top: 1px; left: 50%; width: 12px; height: 8px; transform: translateX(-50%); }
    .legend {

      font-size: 11px; color: var(--muted);
    }
    .legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .legend .d-today { box-shadow: inset 0 0 0 1.5px var(--violet); background: transparent; }
    .legend .d-birth { box-shadow: inset 0 0 0 1.5px #e3c36a; background: transparent; }
    .linkcard {

      display: flex; justify-content: space-between; align-items: center; gap: 8px;

    .sum-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .sum-grid div {
      background: var(--paper); border-radius: 18px; padding: 12px 6px; text-align: center;
      border: 1px solid var(--line);
    }
    .sum-grid span { display: block; font-size: 12px; color: var(--muted); letter-spacing: 0.12em; }

    .sum-grid .neg { color: var(--warn); }
    .bar { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--mist); }
    .bar i { display: block; height: 100%; }
    .bar-legend { text-align: center; color: var(--muted); font-size: 12px; }
    .day-jump { width: 100%; display: flex; justify-content: space-between; padding: 8px 0 4px; font-size: 14px; }
    .subpay { margin: 0 0 6px; color: var(--muted); font-size: 12px; }

    .colophon {
      text-align: center; color: var(--muted); font-size: 12px;
      padding: 18px 0 8px; display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    .colophon strong { color: var(--deep); font-weight: 600; letter-spacing: 0.06em; }

    .tabbar {
      position: fixed; z-index: 8; left: 50%; bottom: 0; transform: translateX(-50%);
      width: min(520px, 100%);
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
      padding: 8px 12px calc(8px + env(safe-area-inset-bottom));

    .tab {

      font-size: 11px; letter-spacing: 0.08em;
    }
    .tab svg { width: 20px; height: 20px; display: block; }
    .tab.is-on { background: var(--mist); color: var(--deep); }

    .mood { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
    .mood i, .mood .cat { position: absolute; font-style: normal; }
    .lantern {
      top: 0; width: 14px; height: 18px; border-radius: 7px 7px 8px 8px;
      background: linear-gradient(#ffd27a, #ef5d4a 70%, #d94a3c);
      transform-origin: top center; animation: sway 3.4s ease-in-out infinite;
      box-shadow: 0 8px 14px rgba(217, 74, 60, 0.22);
    }
    .lantern::before, .lantern::after { content: ""; position: absolute; left: 50%; width: 1px; background: #e7c98a; }
    .lantern::before { top: -12px; height: 12px; }
    .lantern::after { bottom: -6px; height: 6px; }
    .flake {
      top: -8px; width: 5px; height: 5px; border-radius: 50%; background: #fff;

      animation: drift 7s linear infinite;
    }
    .pumpkin {
      bottom: 10px; width: 16px; height: 13px; border-radius: 50%;
      background: radial-gradient(circle at 40% 40%, #ffb067, #e15a22);
      animation: bob 3s ease-in-out infinite;
    }
    .pumpkin::before {
      content: ""; position: absolute; left: 6px; top: -4px; width: 2px; height: 5px;
      background: #6d8a4a; border-radius: 1px;
    }
    .heart {
      bottom: 10px; width: 8px; height: 8px; background: #e48ab0; transform: rotate(45deg);
      animation: rise 6s ease-in infinite;
    }
    .heart::before, .heart::after {
      content: ""; position: absolute; width: 8px; height: 8px; border-radius: 50%; background: #e48ab0;
    }
    .heart::before { left: -4px; }
    .heart::after { top: -4px; }
    .star {
      width: 3px; height: 3px; border-radius: 50%; background: #fff;
      box-shadow: 0 0 6px #b794ea, 0 0 2px #fff;
      animation: twinkle 1.8s ease-in-out infinite;
    }
    .date-card[data-mood="spark"] .star { background: #f3dd9a; box-shadow: 0 0 8px #f3dd9a; }
    .petal {
      top: -10px; width: 8px; height: 12px; border-radius: 80% 0 80% 0;
      background: linear-gradient(#f8e7b0, #e3b84a); transform: rotate(24deg);
      animation: drift 8s linear infinite;
    }
    .leaf {
      top: -8px; width: 10px; height: 14px; background: #c47a4a; border-radius: 0 80% 0 80%;
      animation: drift 7s linear infinite;
    }
    .date-card[data-mood="willow"] .leaf { background: #7ea36a; }
    .egg {
      bottom: 10px; width: 12px; height: 16px;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      background: linear-gradient(#fff, #f3c6e0); animation: bob 3.4s ease-in-out infinite;
    }
    .zongzi {
      bottom: 10px; width: 14px; height: 16px;
      background: linear-gradient(#8eae70, #4d6a3c);
      clip-path: polygon(50% 0, 100% 55%, 50% 100%, 0 55%);
      animation: bob 3.2s ease-in-out infinite;
    }
    .mum {
      bottom: 12px; width: 10px; height: 10px; border-radius: 50%;
      background: radial-gradient(circle, #fff6d2 0 28%, #e3b44a 29% 62%, #c47a4a 63%);
      animation: bob 3.6s ease-in-out infinite;
    }
    .zzz, .digit { top: 18px; animation: rise 5s ease-in infinite; }
    .zzz { font-family: var(--serif); font-size: 14px; color: var(--violet); }
    .digit { font-family: var(--mono); font-size: 11px; color: var(--violet); opacity: 0.55; }
    .candle { bottom: 12px; width: 3px; height: 16px; border-radius: 1px; background: #f6e7c4; animation: flicker 2.4s ease-in-out infinite; }
    .candle::before {
      content: ""; position: absolute; left: -3px; top: -7px; width: 9px; height: 9px; border-radius: 50%;
      background: radial-gradient(circle, #fff6d0, #f0a64a 70%, transparent 72%);
    }
    .moon {
      right: 8px; top: 14px; width: 46px; height: 46px; border-radius: 50%;
      background:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,.95), transparent 20%),
        radial-gradient(circle at 64% 60%, rgba(210, 180, 120, .4), transparent 16%),
        radial-gradient(circle at 40% 40%, #fff7df, #f0d48a);
      box-shadow: 0 0 20px rgba(240, 212, 138, 0.65);
    }
    .book {
      right: 12px; bottom: 12px; width: 26px; height: 18px; border-radius: 2px 4px 4px 2px;
      background: linear-gradient(90deg, #6e45a0 0 48%, #f7f1fb 48% 52%, #8d64c2 52% 100%);
      box-shadow: 0 6px 12px rgba(74, 42, 112, 0.16);
    }
    .cat { width: 48px; right: 6px; bottom: 6px; }
    @keyframes sway { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
    @keyframes drift { from { translate: 0 -12px; } to { translate: 0 250px; opacity: 0.15; } }
    @keyframes rise { from { translate: 0 8px; opacity: 0; } 20% { opacity: 0.85; } to { translate: 0 -36px; opacity: 0; } }
    @keyframes bob { 50% { transform: translateY(-6px); } }
    @keyframes flicker { 50% { opacity: 0.55; } }

    .burst { position: fixed; inset: 0; pointer-events: none; z-index: 45; overflow: hidden; }
    .burst i {
      position: absolute; top: -16px; width: 8px; height: 12px; border-radius: 80% 0 80% 0;
      animation-name: confetti; animation-timing-function: ease-in; animation-fill-mode: forwards;
    }
    @keyframes confetti { to { transform: translateY(105vh) rotate(200deg); opacity: 0.15; } }

    .composer, .dialog { position: fixed; inset: 0; z-index: 30; }
    .dialog { z-index: 40; }
    .mask { position: absolute; inset: 0; background: rgba(22, 12, 32, 0.46); }
    .composer { display: grid; align-items: end; }

      background: var(--paper-solid); box-shadow: var(--shadow);

    .composer-card {

    .composer-card header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .eyebrow { font-size: 11px; letter-spacing: 0.16em; color: var(--muted); }
    .composer-card h2 { font-family: var(--serif); font-size: 22px; font-weight: 600; }
    #expenseCard { scroll-margin-top: 78px; }
    .composer-card textarea {
      width: 100%; min-height: min(48dvh, calc(92dvh - var(--kb, 0px) - 130px)); resize: none;
      border-radius: 16px; background: var(--mist); padding: 14px;
      font-size: 16px; line-height: 1.65;
    }
    .panel {
      position: absolute; left: 0; right: 0; bottom: 0;
      border-radius: 24px 24px 0 0;
      padding: 18px 16px calc(16px + env(safe-area-inset-bottom));
      max-height: min(86dvh, 640px); overflow: auto;
    }
    .panel h2 { font-family: var(--serif); font-size: 22px; margin-bottom: 8px; }
    .about { font-size: 13px; color: var(--muted); line-height: 1.65; }
    .stack-btn { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
    .stack-btn button, .confirm-row button {
      height: 44px; border-radius: 14px; background: var(--mist); letter-spacing: 0.08em;
    }
    .stack-btn .primary, .confirm-row .primary { background: var(--fill); color: var(--on-fill); }
    .confirm-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
    .foot-morse { margin-top: 14px; text-align: center; letter-spacing: 0.08em; }

    .toast {
      position: fixed; z-index: 50; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      display: flex; gap: 12px; align-items: center;
      max-width: calc(100% - 32px);
      background: var(--fill); color: var(--on-fill);
      padding: 10px 14px; border-radius: 999px; font-size: 13px;
      box-shadow: var(--shadow); animation: fade 0.25s ease;
    }
    .toast button { color: inherit; text-decoration: underline; letter-spacing: 0.08em; }

    #splash {
      position: fixed; inset: 0; z-index: 80;
      display: grid; place-items: center;
      background:
        radial-gradient(520px 340px at 50% 42%, rgba(216, 190, 242, 0.7), transparent 70%),
        var(--bg);
      transition: opacity 0.4s ease;
    }
    #splash.leaving { opacity: 0; }
    .splash-inner { text-align: center; color: var(--deep); }
    .splash-flower { width: min(54vw, 220px); height: auto; animation: bloom 1s cubic-bezier(.2, .8, .2, 1) both; }
    @keyframes bloom { from { opacity: 0; transform: scale(0.72) rotate(-8deg); } to { opacity: 1; transform: none; } }
    .splash-name {
      font-family: var(--serif); font-size: 28px; letter-spacing: 0.12em;
      min-height: 1.3em; margin-top: 8px;
    }
    .splash-title { margin-top: 4px; letter-spacing: 0.42em; font-size: 12px; color: var(--muted); }
    .splash-morse { margin-top: 8px; }
    .noscript {
      margin: 24px 16px; text-align: center; color: var(--muted);
    }

    @media (max-width: 380px) {
      .entry-row { grid-template-columns: 1fr auto; }
      .note-input { grid-column: 1 / -1; }
      .brand h1 { letter-spacing: 0.1em; font-size: 16px; }
    }
    @media (min-width: 760px) {
      body { padding: 28px 0 48px; }
      .app {
        background: color-mix(in srgb, var(--paper) 46%, transparent);
        border: 1px solid var(--line); border-radius: 32px;
        min-height: calc(100dvh - 76px); box-shadow: var(--shadow);
      }
      .tabbar {
        bottom: 18px; width: min(488px, calc(100% - 48px));
        border: 1px solid var(--line); border-radius: 20px;
      }
      .composer { align-items: center; }
      .composer-card { border-radius: 24px; width: min(480px, calc(100% - 32px)); }
      .dialog { display: grid; place-items: center; }
      .panel { position: relative; width: min(420px, calc(100% - 32px)); border-radius: 24px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

  const right = document.createElement("strong");
  right.textContent = "记收入";
  lead.append(left, right);
}
function paintCategoryBar(year, month) {
  const bar = byId("catBar");
  const legend = byId("barLegend");
  bar.replaceChildren();
  const prefix = monthKey(year, month) + "-";
  const map = new Map();
  Object.keys(state.data.days).forEach((key) => {
    if (!key.startsWith(prefix)) return;
    (state.data.days[key].expenses || []).forEach((item) => {
      map.set(item.category, (map.get(item.category) || 0) + item.cents);
    });
  });
  const total = [...map.values()].reduce((sum, value) => sum + value, 0);
  if (!total) {
    bar.hidden = true;
    legend.hidden = true;
    return;
  }
  bar.hidden = false;
  legend.hidden = false;
  const colors = ["#7348a8", "#c989b4", "#c9962e", "#6f8fd4", "#5f8f78", "#d07a5a", "#8d6a9a"];
  const ranked = [...map.entries()].sort((a, b) => b[1] - a[1]);
  ranked.forEach(([cat, cents], index) => {
    const seg = document.createElement("i");
    seg.style.width = (cents / total * 100) + "%";
    seg.style.background = colors[index % colors.length];
    seg.title = cat + " ¥" + formatYuan(cents);
    bar.appendChild(seg);
  });
  legend.textContent = ranked.slice(0, 4).map(([cat, cents]) => cat + " " + Math.round(cents / total * 100) + "%").join(" · ");
}
function paintIncomeList(list) {
  const box = byId("incomeList");
  box.replaceChildren();
  if (!list.length) {
    const item = document.createElement("li");
    item.className = "quiet";
    item.textContent = "这个月还没记收入。";
    box.appendChild(item);
    return;
  }
  list.slice().reverse().forEach((entry) => {
    const row = payRow(entry, "delIncome");
    if (!entry.note && entry.at) {
      const parts = entry.at.split("-");
      row.querySelector(".note").textContent = Number(parts[1]) + "月" + Number(parts[2]) + "日记下";
    }
    box.appendChild(row);
  });
}
function paintMonthExpenses(year, month) {
  const box = byId("monthExpList");
  box.replaceChildren();
  const prefix = monthKey(year, month) + "-";
  const keys = Object.keys(state.data.days).filter((key) => key.startsWith(prefix) && state.data.days[key].expenses && state.data.days[key].expenses.length).sort().reverse();
  if (!keys.length) {
    const item = document.createElement("li");
    item.className = "quiet";
    item.textContent = PROFILE.name + "，这个月还没有花销。可以先回到某一天记下。";
    box.appendChild(item);
    return;
  }
  keys.forEach((key) => {
    const day = state.data.days[key];
    const date = parseKey(key);
    const item = document.createElement("li");
    const head = document.createElement("button");
    head.type = "button";
    head.className = "day-jump";
    head.dataset.key = key;
    const name = document.createElement("span");
    name.textContent = (date.getMonth() + 1) + "月" + date.getDate() + "日 " + WEEK[date.getDay()];
    const amount = document.createElement("span");
    amount.textContent = "¥" + formatYuan(sumList(day.expenses));
    head.append(name, amount);
    item.appendChild(head);
    day.expenses.forEach((entry) => {
      const row = document.createElement("p");
      row.className = "subpay";
      row.textContent = entry.category + (entry.note ? " · " + entry.note : "") + "  ¥" + formatYuan(entry.cents);
      item.appendChild(row);
    });
    box.appendChild(item);
  });
}
function paintLedger() {
  const year = state.ledger.y;
  const month = state.ledger.m;
  byId("ledTitle").textContent = year + " 年 " + MONTH_CN[month - 1];
  byId("ledPrev").disabled = year === 1900 && month === 1;
  byId("ledNext").disabled = year === 2100 && month === 12;
  const income = sumList(readIncome(year, month));
  const spent = monthExpenseCents(year, month);
  const balance = income - spent;
  byId("sumIn").textContent = moneyText(income);
  byId("sumOut").textContent = moneyText(spent);
  const balanceNode = byId("sumBal");
  balanceNode.textContent = moneyText(balance);
  balanceNode.classList.toggle("pos", balance > 0);
  balanceNode.classList.toggle("neg", balance < 0);
  paintCategoryBar(year, month);
  paintIncomeList(readIncome(year, month));
  paintMonthExpenses(year, month);
}

function closeComposer() {
  byId("composer").hidden = true;
  if (byId("dialog").hidden) document.body.classList.remove("lock");
}
function openComposer(key) {
  const meta = QUADS.find((item) => item.key === key);
  state.composerKey = key;
  byId("composerEyebrow").textContent = meta.place;
  byId("composerTitle").textContent = meta.title;
  const area = document.querySelector('.quad textarea[data-key="' + key + '"]');
  byId("composerInput").value = area.value;
  byId("composerInput").placeholder = meta.hint;
  byId("composer").hidden = false;
  document.body.classList.add("lock");
  byId("composerInput").focus();
}
function openDialog() {
  byId("dialog").hidden = false;
  document.body.classList.add("lock");
}
function closeDialog() {
  byId("dialog").hidden = true;
  if (byId("composer").hidden) document.body.classList.remove("lock");
}
function showView(name, options) {
  state.view = name;
  document.querySelectorAll(".view").forEach((view) => view.classList.toggle("is-on", view.dataset.view === name));
  document.querySelectorAll(".tab").forEach((tab) => {
    const on = tab.dataset.view === name;
    tab.classList.toggle("is-on", on);
    tab.setAttribute("aria-selected", on ? "true" : "false");
  });
  closeComposer();
  if (name === "day" && !(options && options.skipPaint)) paintDay();
  if (name === "month") paintMonth();
  if (name === "ledger") paintLedger();
}
function setCursor(date, dir) {
  const next = clampDate(date);
  if (keyOf(next) === keyOf(state.cursor)) return false;
  clearTimeout(saveTimer);
  persistNow();
  state.cursor = next;
  state.month = { y: next.getFullYear(), m: next.getMonth() + 1 };
  closeComposer();
  const stage = byId("dayStage");
  stage.classList.remove("from-left", "from-right", "from-fade");
  void stage.offsetWidth;
  stage.classList.add(dir > 0 ? "from-right" : dir < 0 ? "from-left" : "from-fade");
  paintDay();
  if (isBirthday(next)) burst();
  return true;
}
function shiftMonth(which, delta) {
  const current = state[which];
  const next = new Date(current.y, current.m - 1 + delta, 1);
  const year = next.getFullYear();
  const month = next.getMonth() + 1;
  if (year < 1900 || year > 2100) return;
  state[which] = { y: year, m: month };
  if (which === "month") paintMonth();
  else paintLedger();
}
function removeExpense(key, id) {
  const day = state.data.days[key];
  if (!day) return;
  const index = day.expenses.findIndex((item) => item.id === id);
  if (index < 0) return;
  const removed = day.expenses.splice(index, 1)[0];
  prune(key);
  persistNow();
  if (key === keyOf(state.cursor)) {
    paintExpenses();
    paintEmptyHint();
  }
  toast("已删去一笔花销", () => {
    const restored = getOrCreate(key);
    restored.expenses.splice(Math.min(index, restored.expenses.length), 0, removed);
    persistNow();
    if (key === keyOf(state.cursor)) paintExpenses();
    if (state.view === "ledger") paintLedger();
  });
}
function removeIncome(id) {
  const key = monthKey(state.ledger.y, state.ledger.m);
  const list = state.data.incomes[key];
  if (!list) return;
  const index = list.findIndex((item) => item.id === id);
  if (index < 0) return;
  const removed = list.splice(index, 1)[0];
  if (!list.length) delete state.data.incomes[key];
  persistNow();
  paintLedger();
  toast("已删去一笔收入", () => {
    if (!state.data.incomes[key]) state.data.incomes[key] = [];
    state.data.incomes[key].splice(Math.min(index, state.data.incomes[key].length), 0, removed);
    persistNow();
    paintLedger();
  });
}
function openDayFrom(date) {
  const dir = keyOf(date) > keyOf(state.cursor) ? 1 : -1;
  const changed = keyOf(date) === keyOf(state.cursor) ? false : setCursor(date, dir);
  showView("day", { skipPaint: changed });
}
function toggleTheme() {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  state.data.theme = next;
  applyThemeColor();
  persistNow();
}
function followSystem() {
  state.data.theme = null;
  const dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  applyThemeColor();
  persistNow();
  closeDialog();
  toast("已跟随系统配色");
}
function exportData() {
  const blob = new Blob([JSON.stringify(state.data, null, 2)], { type: "application/json" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "嘀嘀嗒嘀的日记-" + PROFILE.name + "-" + keyOf(new Date()) + ".json";
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(link.href), 1500);
  toast("已生成存档文件");
}
function askReplace(data, days, incomes) {
  byId("dialogTitle").textContent = "替换当前存档？";
  const body = byId("dialogBody");
  body.replaceChildren();
  const text = document.createElement("p");
  text.className = "about";
  text.textContent = "这份存档里有 " + days + " 天日记、" + incomes + " 笔收入。导入后，这台手机上现在的内容会被换掉。";
  const row = document.createElement("div");
  row.className = "confirm-row";
  const cancel = document.createElement("button");
  cancel.type = "button";
  cancel.textContent = "取消";
  cancel.addEventListener("click", closeDialog);
  const ok = document.createElement("button");
  ok.type = "button";
  ok.className = "primary";
  ok.textContent = "替换";
  ok.addEventListener("click", () => {
    state.data = data;
    if (data.theme) document.documentElement.dataset.theme = data.theme;
    applyThemeColor();
    persistNow();
    closeDialog();
    paintDay();
    if (state.view === "month") paintMonth();
    if (state.view === "ledger") paintLedger();
    toast("存档已经换上");
  });
  row.append(cancel, ok);
  body.append(text, row);
  openDialog();
}
function openMore() {
  byId("dialogTitle").textContent = "存档";
  const body = byId("dialogBody");
  body.replaceChildren();
  const text = document.createElement("p");
  text.className = "about";
  text.textContent = "日记、天气和账都在这台浏览器里，刷新或关掉再打开还会在。" + PROFILE.name + "，如果清了浏览器数据，或换一个浏览器打开，就读不到了。重要的日子，偶尔导出一份。";
  const actions = document.createElement("div");
  actions.className = "stack-btn";
  const exportButton = document.createElement("button");
  exportButton.type = "button";
  exportButton.className = "primary";
  exportButton.textContent = "导出 JSON";
  exportButton.addEventListener("click", exportData);
  const importButton = document.createElement("button");
  importButton.type = "button";
  importButton.textContent = "导入 JSON";
  importButton.addEventListener("click", () => byId("importFile").click());
  const follow = document.createElement("button");
  follow.type = "button";
  follow.textContent = "配色跟随系统";
  follow.addEventListener("click", followSystem);
  actions.append(exportButton, importButton, follow);
  const foot = document.createElement("p");
  foot.className = "about foot-morse";
  foot.textContent = PROFILE.morseText + "  ·  " + PROFILE.name;
  body.append(text, actions, foot);
  openDialog();
}
function hideSplash() {
  if (splashGone) return;
  splashGone = true;
  clearInterval(typeTimer);
  const splash = byId("splash");
  splash.classList.add("leaving");
  setTimeout(() => { splash.hidden = true; }, 420);
}
function setupSplash() {
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let played = false;
  try { played = sessionStorage.getItem("hydrangea-splash") === "1"; } catch (error) {}
  try { sessionStorage.setItem("hydrangea-splash", "1"); } catch (error) {}
  const nameNode = byId("splashName");
  if (reduce) {
    nameNode.textContent = PROFILE.name;
    byId("splash").hidden = true;
    splashGone = true;
    return;
  }
  if (played) {
    nameNode.textContent = PROFILE.name;
    setTimeout(hideSplash, 420);
  } else {
    nameNode.textContent = "";
    let index = 0;
    typeTimer = setInterval(() => {
      index += 1;
      nameNode.textContent = PROFILE.name.slice(0, index);
      if (index >= PROFILE.name.length) clearInterval(typeTimer);
    }, 78);
    setTimeout(hideSplash, 1560);
  }
  byId("splash").addEventListener("click", hideSplash);
}
function bindCatPicker(container, field) {
  container.addEventListener("click", (event) => {
    const button = event.target.closest(".cat");
    if (!button) return;
    state[field] = button.textContent;
    container.querySelectorAll(".cat").forEach((node) => node.classList.toggle("is-on", node === button));
  });
}
function bindEvents() {
  byId("btnTheme").addEventListener("click", toggleTheme);
  byId("btnMore").addEventListener("click", openMore);
  byId("dialogMask").addEventListener("click", closeDialog);
  byId("composerMask").addEventListener("click", closeComposer);
  byId("composerDone").addEventListener("click", closeComposer);
  byId("prevDay").addEventListener("click", () => setCursor(addDays(state.cursor, -1), -1));
  byId("nextDay").addEventListener("click", () => setCursor(addDays(state.cursor, 1), 1));
  byId("backToday").addEventListener("click", () => {
    const today = new Date();
    setCursor(today, keyOf(today) > keyOf(state.cursor) ? 1 : -1);
  });
  byId("weatherRow").addEventListener("click", (event) => {
    const button = event.target.closest("[data-weather]");
    if (!button) return;
    const key = keyOf(state.cursor);
    const day = getOrCreate(key);
    const id = button.dataset.weather;
    const selected = weatherList(day.weather);
    day.weather = selected.includes(id) ? selected.filter((item) => item !== id) : selected.concat(id);
    prune(key);
    schedulePersist();
    paintWeather();
    paintEmptyHint();
  });
  byId("weatherNoteInput").addEventListener("input", () => {
    const key = keyOf(state.cursor);
    const day = getOrCreate(key);
    day.weatherNote = byId("weatherNoteInput").value.slice(0, 80);
    prune(key);
    schedulePersist();
    paintEmptyHint();
  });
  document.querySelectorAll(".quad textarea").forEach((area) => {
    area.addEventListener("input", () => {
      const key = keyOf(state.cursor);
      const day = getOrCreate(key);
      day[area.dataset.key] = area.value;
      prune(key);
      schedulePersist();
      paintEmptyHint();
      if (!byId("composer").hidden && state.composerKey === area.dataset.key && document.activeElement !== byId("composerInput")) {
        byId("composerInput").value = area.value;
      }
    });
  });
  byId("quadGrid").addEventListener("click", (event) => {
    const button = event.target.closest("[data-expand]");
    if (!button) return;
    openComposer(button.dataset.expand);
  });
  byId("composerInput").addEventListener("input", () => {
    const area = document.querySelector('.quad textarea[data-key="' + state.composerKey + '"]');
    if (area.value !== byId("composerInput").value) {
      area.value = byId("composerInput").value;
      area.dispatchEvent(new Event("input", { bubbles: true }));
    }
  });
  byId("expForm").addEventListener("submit", (event) => {
    event.preventDefault();
    const cents = parseYuan(byId("expAmount").value);
    const error = byId("expError");
    if (cents == null) {
      error.hidden = false;
      error.textContent = "金额要大于 0。";
      return;
    }
    error.hidden = true;
    const key = keyOf(state.cursor);
    const day = getOrCreate(key);
    day.expenses.push({
      id: uid(),
      category: state.expCat,
      cents,
      note: byId("expNote").value.trim().slice(0, 40),
      at: key,
    });
    byId("expAmount").value = "";
    byId("expNote").value = "";
    persistNow();
    clearTimeout(saveTimer);
    paintExpenses();
    paintEmptyHint();
    toast("花销已记在这一天");
  });
  byId("inForm").addEventListener("submit", (event) => {
    event.preventDefault();
    const cents = parseYuan(byId("inAmount").value);
    const error = byId("inError");
    if (cents == null) {
      error.hidden = false;
      error.textContent = "金额要大于 0。";
      return;
    }
    error.hidden = true;
    const key = monthKey(state.ledger.y, state.ledger.m);
    if (!state.data.incomes[key]) state.data.incomes[key] = [];
    state.data.incomes[key].push({
      id: uid(),
      category: state.inCat,
      cents,
      note: byId("inNote").value.trim().slice(0, 40),
      at: keyOf(new Date()),
    });
    byId("inAmount").value = "";
    byId("inNote").value = "";
    persistNow();
    paintLedger();
    toast("这笔收入记下了");
  });
  byId("expAmount").addEventListener("input", () => { byId("expError").hidden = true; });
  byId("inAmount").addEventListener("input", () => { byId("inError").hidden = true; });
  byId("expList").addEventListener("click", (event) => {
    const button = event.target.closest("[data-del-exp]");
    if (!button) return;
    removeExpense(keyOf(state.cursor), button.dataset.delExp);
  });
  byId("incomeList").addEventListener("click", (event) => {
    const button = event.target.closest("[data-del-income]");
    if (!button) return;
    removeIncome(button.dataset.delIncome);
  });
  byId("monthExpList").addEventListener("click", (event) => {
    const button = event.target.closest("button[data-key]");
    if (!button) return;
    openDayFrom(parseKey(button.dataset.key));
  });
  byId("calGrid").addEventListener("click", (event) => {
    const button = event.target.closest("button[data-key]");
    if (!button) return;
    openDayFrom(parseKey(button.dataset.key));
  });
  byId("monthPrev").addEventListener("click", () => shiftMonth("month", -1));
  byId("monthNext").addEventListener("click", () => shiftMonth("month", 1));
  byId("ledPrev").addEventListener("click", () => shiftMonth("ledger", -1));
  byId("ledNext").addEventListener("click", () => shiftMonth("ledger", 1));
  byId("monthToday").addEventListener("click", () => {
    const now = new Date();
    state.month = { y: now.getFullYear(), m: now.getMonth() + 1 };
    paintMonth();
  });
  byId("ledToday").addEventListener("click", () => {
    const now = new Date();
    state.ledger = { y: now.getFullYear(), m: now.getMonth() + 1 };
    paintLedger();
  });
  byId("toLedger").addEventListener("click", () => {
    state.ledger = { y: state.month.y, m: state.month.m };
    showView("ledger");
  });
  document.querySelector(".tabbar").addEventListener("click", (event) => {
    const tab = event.target.closest(".tab");
    if (!tab) return;
    showView(tab.dataset.view);
  });
  bindCatPicker(byId("expCats"), "expCat");
  bindCatPicker(byId("inCats"), "inCat");
  byId("importFile").addEventListener("change", (event) => {
    const file = event.target.files && event.target.files[0];
    event.target.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = normalize(JSON.parse(String(reader.result)));
        const days = Object.keys(data.days).length;
        const incomes = Object.keys(data.incomes).reduce((sum, key) => sum + data.incomes[key].length, 0);
        askReplace(data, days, incomes);
      } catch (error) {
        toast("这个文件不是嘀嘀嗒嘀的日记的存档");
      }
    };
    reader.readAsText(file, "utf-8");
  });
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
      closeDialog();
      closeComposer();
    }
    const tag = document.activeElement && document.activeElement.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (!byId("dialog").hidden || !byId("composer").hidden) return;
    if (state.view !== "day") return;
    if (event.key === "ArrowLeft") setCursor(addDays(state.cursor, -1), -1);
    if (event.key === "ArrowRight") setCursor(addDays(state.cursor, 1), 1);
  });
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") persistNow();
  });
  window.addEventListener("pagehide", () => persistNow());
  let touchX = 0;
  let touchY = 0;
  let touchTarget = null;
  byId("dayStage").addEventListener("touchstart", (event) => {
    const point = event.changedTouches[0];
    touchX = point.clientX;
    touchY = point.clientY;
    touchTarget = event.target;
  }, { passive: true });
  byId("dayStage").addEventListener("touchend", (event) => {
    if (touchTarget && touchTarget.closest && touchTarget.closest("input, textarea, button, .weather-row")) return;
    const point = event.changedTouches[0];
    const dx = point.clientX - touchX;
    const dy = point.clientY - touchY;
    if (Math.abs(dx) < 64 || Math.abs(dx) < Math.abs(dy) * 1.4) return;
    setCursor(addDays(state.cursor, dx < 0 ? 1 : -1), dx < 0 ? 1 : -1);
  }, { passive: true });
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", () => {
      const overlap = Math.max(0, window.innerHeight - window.visualViewport.height);
      document.documentElement.style.setProperty("--kb", overlap + "px");
    });
  }
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", (event) => {
    if (state.data.theme) return;
    document.documentElement.dataset.theme = event.matches ? "dark" : "light";
    applyThemeColor();
  });
}
function fillCats(container, cats, current) {
  container.replaceChildren();
  cats.forEach((cat) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "cat" + (cat === current ? " is-on" : "");
    button.textContent = cat;
    container.appendChild(button);
  });
}
function boot() {
  state.data = load();
  const now = state.cursor;
  state.month = { y: now.getFullYear(), m: now.getMonth() + 1 };
  state.ledger = { y: state.month.y, m: state.month.m };
  if (state.data.theme === "light" || state.data.theme === "dark") {
    document.documentElement.dataset.theme = state.data.theme;
  }
  applyThemeColor();
  applyNames();
  applyQuadCopy();
  renderMorse();
  fillCats(byId("expCats"), EXP_CATS, state.expCat);
  fillCats(byId("inCats"), IN_CATS, state.inCat);
  bindEvents();
  paintDay();
  if (isBirthday(state.cursor)) burst();
  setupSplash();
}

if (typeof document !== "undefined") boot();

  </script>
</body>
